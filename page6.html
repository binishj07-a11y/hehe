<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Best Gift</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           PAGE
           1440 × 1024
        ========================= */

        .page {
            position: relative;

            width: min(100vw, calc(100vh * 1.40625));
            height: min(100vh, calc(100vw / 1.40625));

            background-image: url("page6.jpeg");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           HOME
        ========================= */

        .home {
            position: absolute;

            top: 5%;
            right: 7%;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: #ff4fa3;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            transition: transform 0.2s ease;
        }


        /* Roof */

        .home::before {
            content: "";

            position: absolute;

            width: 10px;
            height: 10px;

            border-left: 2px solid #b00050;
            border-top: 2px solid #b00050;

            transform: rotate(45deg);

            top: 6px;
        }


        /* House */

        .home::after {
            content: "";

            position: absolute;

            width: 11px;
            height: 9px;

            border: 2px solid #b00050;

            border-top: none;

            bottom: 6px;
        }


        .home:hover {
            transform: scale(1.12);
        }


        /* =========================
           BACK
        ========================= */

        .back {
            position: absolute;

            left: 3%;
            bottom: 1%;

            width: 105px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.3);

            color: white;

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-size: 13px;
            font-weight: bold;

            transition: all 0.25s ease;
        }


        .back:hover {
            background: rgba(255, 255, 255, 0.18);

            transform: translateX(-4px);
        }

    </style>
</head>

<body>

    <main class="page">

        <!-- HOME -->
        <a href="index.html"
           class="home"
           aria-label="Home">
        </a>


        <!-- BACK -->
        <a href="page4.html"
           class="back">
            BACK
        </a>

    </main>

</body>
</html>
