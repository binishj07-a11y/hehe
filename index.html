<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Riya's Birthday</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* The actual birthday page */
       .page {
    position: relative;
    width: min(100vw, calc(100vh * 1.40625));
    height: min(100vh, calc(100vw / 1.40625));

    background-image: url("page1.jpeg");
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
}

        /* NEXT button */
      .next {
    position: absolute;
    right: 4%;
    bottom: 3%;

    width: 105px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 25px;

    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.5);

    color: white;
    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: bold;

    z-index: 100;
}

.next:hover {
    background: rgba(255, 255, 255, 0.18);

    transform: translateX(4px);
}
@media (max-width: 600px) {

    .page {
        width: 100vw;
        height: 100vh;

        background-size: cover;
        background-position: center;
    }

    .next {
        right: 5%;
        bottom: 3%;
        width: 100px;
        height: 43px;
        z-index: 100;
    }
}
    </style>
</head>

<body>

    <div class="page">

        <a href="page2.html" class="next">
    NEXT
</a>

    </div>

</body>
</html>
