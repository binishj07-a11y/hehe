<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blow the Candle</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            position: relative;

            width: calc(100vh * 1.40625);
            height: 100vh;

            max-width: 100vw;

            background-image: url("page2.jpeg");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* BLOW THE CANDLE button */
        .blow-button {
            position: absolute;

            top: 4%;
            left: 11%;

            width: 78%;
            height: 18%;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 100px;

            background: rgba(255, 235, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.8);

            color: black;

            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(22px, 3vw, 36px);

            text-decoration: none;

            transition: 0.3s ease;
        }

        .blow-button:hover {
            background: rgba(255, 245, 255, 0.9);
            transform: scale(1.02);
        }

        /* HOME button */
        .home {
            position: absolute;

            top: 1%;
            right: 7%;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: #ff1493;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #8b003f;

            text-decoration: none;

            font-size: 17px;

            transition: 0.3s ease;
        }

        .home:hover {
            transform: scale(1.1);
        }

        /* BACK button */
        .back {
            position: absolute;

            left: 3%;
            bottom: 1%;

            width: 105px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 25px;

            color: white;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;

            text-decoration: none;

            border-bottom: 1px solid white;

            background: rgba(255, 255, 255, 0.08);

            transition: 0.3s ease;
        }

        .back:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-4px);
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- Home -->
        <a href="index.html" class="home">
            🏠
        </a>

        <!-- Blow the candle -->
        <a href="page3.html" class="blow-button">
            BLOW THE CANDLE
        </a>

        <!-- Back -->
        <a href="index.html" class="back">
            BACK
        </a>

    </div>

</body>
</html>
