<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Choose a Gift</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================
           ACTUAL DESIGN AREA
           1440 × 1024
        ========================= */

        .page {
            position: relative;

            width: min(100vw, calc(100vh * 1.40625));
            height: min(100vh, calc(100vw / 1.40625));

            background-image: url("page4.png");
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           HOME
        ========================= */

        .home {
            position: absolute;

            top: 1%;
            right: 7%;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: #ff4fa3;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            transition: transform 0.2s ease;
        }

        .home::before {
            content: "";

            position: absolute;

            width: 10px;
            height: 10px;

            border-left: 2px solid #b00050;
            border-top: 2px solid #b00050;

            transform: rotate(45deg);

            top: 6px;
        }

        .home::after {
            content: "";

            position: absolute;

            width: 11px;
            height: 9px;

            border: 2px solid #b00050;
            border-top: none;

            bottom: 6px;
        }

        .home:hover {
            transform: scale(1.12);
        }


        /* =========================
           GIFT BUTTONS
        ========================= */

        .gift {
            position: absolute;

            left: 50%;
            transform: translateX(-50%);

            width: 68%;
            height: 9%;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50px;

            background: rgba(255, 210, 235, 0.35);

            border: 1px solid rgba(255, 150, 200, 0.45);

            color: #f3a5c5;

            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: clamp(18px, 2.5vw, 34px);
            font-weight: 500;

            transition: all 0.25s ease;
        }

        .gift:hover {
            background: rgba(255, 225, 240, 0.6);

            transform: translateX(-50%) scale(1.02);

            color: #ee8eb5;
        }


        /* NORMAL GIFT */

        .normal {
            top: 44%;
        }


        /* SPECIAL GIFT */

        .special {
            top: 61%;
        }


        /* =========================
           BACK
           SAME STYLE AS OTHER PAGES
        ========================= */

        .back {
            position: absolute;

            left: 3%;
            bottom: 1%;

            width: 105px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.3);

            color: white;

            text-decoration: none;

            font-family: Arial, sans-serif;
            font-size: 13px;
            font-weight: bold;

            transition: all 0.25s ease;
        }

        .back:hover {
            background: rgba(255, 255, 255, 0.18);

            transform: translateX(-4px);
        }

    </style>
</head>

<body>

    <main class="page">

        <!-- HOME -->
        <a href="index.html"
           class="home"
           aria-label="Home">
        </a>


        <!-- NORMAL GIFT -->
        <a href="page5.html"
           class="gift normal">
            NORMAL GIFT
        </a>


        <!-- SPECIAL GIFT -->
        <a href="page6.html"
           class="gift special">
            SPECIAL GIFT
        </a>


        <!-- BACK -->
        <a href="page3.html"
           class="back">
            BACK
        </a>

    </main>

</body>
</html>
